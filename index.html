<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Quran Quest</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"></script>

<link rel="preload" href="/fonts/PDMS_SALEEM_QURANFONTQESHIP_0.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/Gilroy-Medium.woff2" as="font" type="font/woff2" crossorigin>



  <link
  href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined"
  rel="stylesheet"
/>
<link
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
  rel="stylesheet"
/>

  

  <link rel="stylesheet" href="/index-style.css">
</head>
<body>


      <!-- Hero banner -->


  <div class="navbar" id="mainNavbar">
    <div class="navbar-left">
      <!--<button class="login-btn" id="loginBtn">👤</button> -->
      <button class="menu-btn" id="menuBtn">
        <div id="menuLottie"></div>
      </button>

   
    </div>
    <div class="navbar-center dropdowns">
      <select id="surahSelect"></select>
      <select id="ayahSelect"></select>
      
    </div>
    <div id="gameStatsNav">
    </div>
    <div class="navbar-right">
      
      <button id="returnToAyah" class="return-btn">Return to Ayah</button>
      <div class="streak-info" id="streakDisplay">&#128293;0</div>
    </div>
  </div>
  <div id="surahProgressWrap" aria-hidden="true">
    <div id="surahProgressFill"></div>
    <div id="surahProgressMarkers" aria-hidden="true">
      <span data-pct="10"></span>
      <span data-pct="35"></span>
      <span data-pct="50"></span>
      <span data-pct="90"></span>
      <span data-pct="100"></span>
    </div>
    <button id="surahProgressInfo" type="button" aria-label="Surah progress info"></button>
    <div id="surahProgressTip" role="status" aria-live="polite"></div>
  </div>

  <!-- HTML -->
<div id="profileDrawer" class="profile-drawer qq-sidebar">

  <div class="drawer-header qq-sidebar-header">
    <span class="qq-logo"><span class="material-icons-outlined">mosque</span></span>
    <span class="qq-title">My Quran Quest</span>
    <button id="drawerCloseBtn" class="drawer-close">✕</button>
  </div>

  <nav class="qq-nav">
  <button class="qq-nav-item active" id="goHomeBtn" type="button">
    <span class="material-icons-outlined">home</span>
    <span>Home</span>
  </button>


    <button class="qq-nav-item" id="learningJourneyBtn">
      <span class="material-icons-outlined">calendar_month</span> 
      <span>My Learning Journey</span>
    </button>

    <button class="qq-nav-item" id="aboutBtn">
      <span class="material-icons-outlined">info</span> 
      <span>About</span>
    </button>
  </nav>

  <div class="drawer-footer">
    <p></p>
  </div>

</div>


<div id="swipeHint" class="swipe-hint hidden">
  <div class="swipe-content">
    <div id="swipeLottie"></div>
    <div class="swipe-text">
      Swipe left or right to change verses
    </div>
  </div>
</div>


<div id="hero" class="hero">
  <div class="hero-content">

    <h1>Quran Quest</h1>




    <p class="hero-description">
      ...where every ayah is its own universe. A divine message from Allah!
    </p>

    <p class="hero-subtitle">
      "The best among you are those who learn the Quran and teach it."<br>
      — The Prophet (ﷺ)
    </p>

    <div class="hero-actions">
      <button id="startLearningBtn" class="cta-btn">Start Learning</button>
    </div>

  </div>
</div>


<div id="duasView" class="duas-view" aria-hidden="true">
  <iframe id="duasFrame" title="Daily Ramzan Duas" loading="lazy"></iframe>
</div>


  <div class="container" id="surahContainer">
    
  </div>



<div class="viewer" id="viewer">
  <div id="gestureLayer"></div>

  <!-- 🃏 Card wrapper -->
  <div id="ayahCard" class="ayah-card">
    <iframe id="ayahViewer"></iframe>
  </div>
</div>

      <span>Learn Quran</span>

    <button class="bottom-nav-btn" id="navRamzanDuas" type="button">
      <span class="material-symbols-outlined" aria-hidden="true">prayer_times</span>
      <span>Ramzan Duas</span>
    </button>
  </div>
</nav>
