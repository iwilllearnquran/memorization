<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📖 Quran Explorer - Surah List</title>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f9f9f9;
      color: #0a4d68;
    }
    .navbar {
      background-color: #0a4d68;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 4px solid #2ca7d8;
    }
    .login-btn {
      background-color: #ffffff;
      color: #0a4d68;
      border: 2px solid #0a4d68;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .login-btn:hover {
      background-color: #e3f2f9;
    }
    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }
    .surah-card {
      background: white;
      padding: 16px;
      border-radius: 12px;
      border: 3px solid rgba(10, 77, 104, 0.2);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.3s;
    }
    .surah-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.1);
      border-color: rgba(10, 77, 104, 0.35);
    }
    .surah-number { font-size: 14px; color: #999; }
    .surah-english { font-size: 18px; font-weight: bold; margin-top: 8px; }
    .surah-arabic { font-size: 22px; text-align: right; margin-top: 6px; color: #222; }
    .ayah-count { font-size: 13px; color: #666; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="navbar">
    <span>🕌 Explore Surahs</span>
    <button id="loginBtn" class="login-btn">Login</button>
  </div>
  <div class="container" id="surahContainer"></div>
  <div id="userInfo" style="text-align:center; margin-top: 20px;"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA8K3idA6lR9sfA_fY23H5f4jHeugzSLm4",
      authDomain: "myquranquest.com",
      projectId: "quranquest-370c4",
      storageBucket: "quranquest-370c4.appspot.com",
      messagingSenderId: "167269428719",
      appId: "1:167269428719:web:4dc5e9dfb91b5805af5a1a",
      measurementId: "G-D7KR30RKFP"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    document.getElementById("loginBtn").onclick = () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then(result => {
          const user = result.user;
          document.getElementById("userInfo").innerHTML = `
            <p><strong>✅ Logged in as:</strong> ${user.displayName}</p>
            <p>Email: ${user.email}</p>
            <img src="${user.photoURL}" width="80"/>
          `;
        })
        .catch(error => {
          console.error("❌ Login error:", error);
          alert("Login failed: " + error.message);
        });
    };
  const surahSelect = document.getElementById('surahSelect');
  const ayahSelect = document.getElementById('ayahSelect');
  const ayahViewer = document.getElementById('ayahViewer');
  const nextArrow = document.getElementById('nextArrow');
  const prevArrow = document.getElementById('prevArrow');

  function getURLParam(name) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(name);
  }

  function updateAyahOptions(cb) {
    const count = +surahSelect.selectedOptions[0].dataset.ayahCount;
    ayahSelect.innerHTML = '';
    for (let i = 1; i <= count; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `Ayah ${i}`;
      ayahSelect.appendChild(opt);
    }
    if (cb) cb();
  }

  function saveLastRead(s, a) {
    localStorage.setItem('lastRead', JSON.stringify({ surah: s, ayah: a }));
  }

  function loadAyah() {
    const s = surahSelect.value, a = ayahSelect.value;
    ayahViewer.src = `ayahs/surah_${s}/ayah_${s}_${a}.html`;
    ayahViewer.style.display = 'block';
    nextArrow.style.display = 'block';
    prevArrow.style.display = 'block';
    saveLastRead(s, a);
    document.getElementById('ajrPoints').textContent =
      `${Math.floor((a / +surahSelect.selectedOptions[0].dataset.ayahCount) * 100)}%`;
  }

  function loadNextAyah() {
    let curr = +ayahSelect.value;
    const max = +surahSelect.selectedOptions[0].dataset.ayahCount;
    if (curr < max) {
      ayahSelect.value = curr + 1;
      loadAyah();
    } else if (surahSelect.selectedIndex < surahSelect.options.length - 1) {
      surahSelect.selectedIndex++;
      updateAyahOptions(() => {
        ayahSelect.value = 1;
        loadAyah();
      });
    } else {
      alert("✅ You've reached the last ayah.");
    }
  }

  function loadPrevAyah() {
    let curr = +ayahSelect.value;
    if (curr > 1) {
      ayahSelect.value = curr - 1;
      loadAyah();
    } else if (surahSelect.selectedIndex > 0) {
      surahSelect.selectedIndex--;
      updateAyahOptions(() => {
        const newCount = +surahSelect.selectedOptions[0].dataset.ayahCount;
        ayahSelect.value = newCount;
        loadAyah();
      });
    } else {
      alert("📖 This is the very first ayah.");
    }
  }

  fetch('https://api.quran.com/api/v4/chapters')
    .then(res => res.json())
    .then(data => {
      data.chapters.forEach(ch => {
        const opt = document.createElement('option');
        opt.value = ch.id;
        opt.textContent = `${ch.id}. ${ch.name_simple} (${ch.name_arabic})`;
        opt.setAttribute('data-ayah-count', ch.verses_count);
        surahSelect.appendChild(opt);
      });

      const urlSurah = getURLParam('surah');
      const urlAyah = getURLParam('ayah');
      const lastRead = JSON.parse(localStorage.getItem('lastRead'));

      if (urlSurah && urlAyah) {
        // Direct URL access — no prompt
        surahSelect.value = urlSurah;
        updateAyahOptions(() => {
          ayahSelect.value = urlAyah;
          loadAyah();
        });
      } else if (!sessionStorage.getItem('resumePrompted') && lastRead) {
        if (confirm(`📌 Resume from Surah ${lastRead.surah}, Ayah ${lastRead.ayah}?`)) {
          surahSelect.value = lastRead.surah;
          updateAyahOptions(() => {
            ayahSelect.value = lastRead.ayah;
            loadAyah();
          });
        } else {
          updateAyahOptions(() => {
            ayahSelect.value = 1;
            loadAyah();
          });
        }
        sessionStorage.setItem('resumePrompted', 'true');
      } else {
        updateAyahOptions(() => {
          ayahSelect.value = 1;
          loadAyah();
        });
      }
    });

  surahSelect.addEventListener('change', () => updateAyahOptions(loadAyah));
  ayahSelect.addEventListener('change', loadAyah);
</script>

</body>
</html>
