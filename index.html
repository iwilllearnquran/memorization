<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📖 Quran Explorer - Surah List</title>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f9f9f9;
      color: #0a4d68;
    }
    .navbar {
      background-color: #0a4d68;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 4px solid #2ca7d8;
    }
    .login-btn {
      background-color: #ffffff;
      color: #0a4d68;
      border: 2px solid #0a4d68;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .login-btn:hover {
      background-color: #e3f2f9;
    }
    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }
    .surah-card {
      background: white;
      padding: 16px;
      border-radius: 12px;
      border: 3px solid rgba(10, 77, 104, 0.2);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.3s;
    }
    .surah-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.1);
      border-color: rgba(10, 77, 104, 0.35);
    }
    .surah-number { font-size: 14px; color: #999; }
    .surah-english { font-size: 18px; font-weight: bold; margin-top: 8px; }
    .surah-arabic { font-size: 22px; text-align: right; margin-top: 6px; color: #222; }
    .ayah-count { font-size: 13px; color: #666; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="navbar">
    <span>🕌 Explore Surahs</span>
    <button id="loginBtn" class="login-btn">Login</button>
  </div>
  <div class="container" id="surahContainer"></div>
  <div id="userInfo" style="text-align:center; margin-top: 20px;"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA8K3idA6lR9sfA_fY23H5f4jHeugzSLm4",
      authDomain: "myquranquest.com",
      projectId: "quranquest-370c4",
      storageBucket: "quranquest-370c4.appspot.com",
      messagingSenderId: "167269428719",
      appId: "1:167269428719:web:4dc5e9dfb91b5805af5a1a",
      measurementId: "G-D7KR30RKFP"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    document.getElementById("loginBtn").onclick = () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then(result => {
          const user = result.user;
          document.getElementById("userInfo").innerHTML = `
            <p><strong>✅ Logged in as:</strong> ${user.displayName}</p>
            <p>Email: ${user.email}</p>
            <img src="${user.photoURL}" width="80"/>
          `;
        })
        .catch(error => {
          console.error("❌ Login error:", error);
          alert("Login failed: " + error.message);
        });
    };
  </script>

  <script>
    const lastRead = JSON.parse(localStorage.getItem('lastRead'));
    if (lastRead) {
      const confirmResume = confirm(`📌 Resume from Surah ${lastRead.surah}, Ayah ${lastRead.ayah}?`);
      if (confirmResume) {
        window.location.href = `viewer.html?surah=${lastRead.surah}&ayah=${lastRead.ayah}`;
      }
    }

    fetch("https://api.quran.com/api/v4/chapters")
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('surahContainer');
        data.chapters.forEach(surah => {
          const card = document.createElement('div');
          card.className = "surah-card";
          card.innerHTML = `
            <div class="surah-number">Surah ${surah.id}</div>
            <div class="surah-english">${surah.name_simple}</div>
            <div class="surah-arabic">${surah.name_arabic}</div>
            <div class="ayah-count">${surah.verses_count} Ayahs</div>
          `;
          card.onclick = () => {
            window.location.href = `viewer.html?surah=${surah.id}&ayah=1`;
          };
          container.appendChild(card);
        });
      });
  </script>
</body>
</html>
