<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a4d68" />
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Quran Explorer" />
  <title>📖 Understand Quran Better</title>

  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f9f9f9;
      color: #0a4d68;
    }
    .navbar {
      background-color: #0a4d68;
      color: white;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 4px solid #2ca7d8;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .navbar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .auth-btn {
      background: white;
      color: #0a4d68;
      border: none;
      padding: 8px 14px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }
    .surah-card {
      background: white;
      padding: 16px;
      border-radius: 12px;
      border: 3px solid rgba(10, 77, 104, 0.2);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.3s;
    }
    .surah-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.1);
      border-color: rgba(10, 77, 104, 0.35);
    }
    .surah-number { font-size: 14px; color: #999; }
    .surah-english { font-size: 18px; font-weight: bold; margin-top: 8px; }
    .surah-arabic { font-size: 22px; text-align: right; margin-top: 6px; color: #222; }
    .ayah-count { font-size: 13px; color: #666; margin-top: 4px; }
    .viewer {
      max-width: 1000px;
      margin: 30px auto;
      height: 80vh;
      border: 2px solid #0a4d68;
      border-radius: 8px;
      overflow: hidden;
      display: none;
    }
    .viewer iframe {
      width: 100%; height: 100%; border: none;
    }
  </style>
</head>
<body>

<div class="navbar">
  <div class="navbar-inner">
    <div>🕌 Explore Surahs</div>
    <button id="authBtn" class="auth-btn">Login</button>
  </div>
</div>

<div class="container" id="surahContainer"></div>
<div class="viewer" id="ayahViewerBox">
  <iframe id="ayahViewer"></iframe>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyA8K3idA6lR9sfA_fY23H5f4jHeugzSLm4",
    authDomain: "quranquest-370c4.firebaseapp.com",
    projectId: "quranquest-370c4",
    storageBucket: "quranquest-370c4.appspot.com",
    messagingSenderId: "167269428719",
    appId: "1:167269428719:web:4dc5e9dfb91b5805af5a1a"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const authBtn = document.getElementById('authBtn');
  function updateAuthUI(user) {
    authBtn.textContent = user ? 'Logout' : 'Login';
  }
  authBtn.onclick = () => {
    const user = auth.currentUser;
    if (user) {
      auth.signOut();
    } else {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(console.error);
    }
  }
  auth.onAuthStateChanged(updateAuthUI);
</script>

<!-- Load Surah Cards -->
<script>
  const container = document.getElementById('surahContainer');
  const iframeBox = document.getElementById('ayahViewerBox');
  const iframe = document.getElementById('ayahViewer');
  fetch("https://api.quran.com/api/v4/chapters")
    .then(res => res.json())
    .then(data => {
      data.chapters.forEach(surah => {
        const card = document.createElement('div');
        card.className = "surah-card";
        card.innerHTML = `
          <div class="surah-number">Surah ${surah.id}</div>
          <div class="surah-english">${surah.name_simple}</div>
          <div class="surah-arabic">${surah.name_arabic}</div>
          <div class="ayah-count">${surah.verses_count} Ayahs</div>
        `;
        card.onclick = () => {
          iframeBox.style.display = 'block';
          iframe.src = \`output/surah_\${surah.id}/ayah_\${surah.id}_1.html\`;
        };
        container.appendChild(card);
      });
    });
</script>

<!-- PWA Support -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js')
      .then(() => console.log('✅ Service Worker registered'))
      .catch(err => console.error('Service Worker registration failed:', err));
  }
</script>

</body>
</html>
