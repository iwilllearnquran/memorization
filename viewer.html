<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📖 Quran Viewer</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <!-- Material Icons -->
    <link
  href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
  rel="stylesheet"
/>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', 'CustomArabic', sans-serif !important;
      background: #f9f9f9;
      overflow-x: hidden;
    }
	
	*:not(.material-icons):not(.material-icons-outlined):not([class^="material-icons"]):not(.grammar-info):not(.grammar-info *) {
	  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; !important;
	}
	
	@font-face {
	  font-family: 'CustomArabic';
	  src: url('/PDMS_SALEEM_QURANFONTQESHIP_0.ttf') format('truetype');
	}

	@font-face {
	  font-family: 'Roboto';
	  src: url('/Gilroy-Medium.ttf') format('truetype');
	}

    .navbar {
      background-color: #0a4d68;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      border-bottom: 4px solid #2ca7d8;
      position: relative;
      z-index: 2;
    }

    .navbar-left, .navbar-center, .navbar-right {
      display: flex;
      align-items: center;
    }

    .navbar-center {
      flex: 1;
      justify-content: center;
      gap: 5px;
    }

    #surahSelect {
      width: 120px;
      padding: 8px;
      font-size: 14px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    #ayahSelect {
      width: 60px;
      padding: 8px;
      font-size: 14px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .streak-info {
      font-size: 14px;
      margin-right: 10px;
    }

    .menu-toggle {
      background-color: white;
      color: #0a4d68;
      font-size: 22px;
      border: 2px solid #0a4d68;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
    }

    .profile-drawer {
      position: fixed;
      top: 0;
      left: -1000px;
      width: 340px;
      height: 100%;
      background: white;
      color: #0a4d68;
      box-shadow: 2px 0 10px rgba(0,0,0,0.2);
      transition: left 0.3s ease;
      z-index: 1001;
      border-right: 1px solid #ccc;
    }

    .profile-drawer.open {
      left: 0;
    }

    .profile-drawer button {
      margin-top: 12px;
      padding: 6px 12px;
      font-size: 14px;
      background-color: #f44336;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .viewer {
      height: calc(100vh - 60px);
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .side-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: white;
      color: #0a4d68;
      border: 2px solid #0a4d68;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      text-align: center;
      line-height: 36px;
      cursor: pointer;
      display: none;
      z-index: 1;
    }

    .next { right: 10px; }
    .prev { left: 10px; }
	
	  .material-symbols-outlined {
		font-family: 'Material Symbols Outlined';
		font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
	  }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="navbar-left">
      <button class="menu-toggle" onclick="toggleMenu()">
        <span class="material-icons-outlined">person</span>
      </button>
    </div>
    <div class="navbar-center">
      <select id="surahSelect"></select>
      <select id="ayahSelect"></select>
    </div>
    <div class="navbar-right">
      <div class="streak-info" id="streakDisplay">🔥0</div>
    </div>
  </div>

  <!-- Profile Drawer -->
  <div class="profile-drawer" id="profileMenu">
    <div style="padding: 16px;">
      <h3>👤 Profile</h3>
      <p><strong>Logged in as:</strong> <span id="userName">Guest</span></p>
      <p id="userEmail"></p>
      <p><strong>Ajr Points:</strong> <span id="ajrPoints">0%</span></p>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="viewer" onclick="closeMenuIfOpen(event)">
    <div class="side-arrow prev" id="prevArrow" onclick="loadPrevAyah()">←</div>
    <div class="side-arrow next" id="nextArrow" onclick="loadNextAyah()">→</div>
    <iframe id="ayahViewer"></iframe>
  </div>
  <div id="calendarPopup" style="display:none; position: fixed; top: 70px; right: 10px; background: white; border: 1px solid #ccc; box-shadow: 0 4px 8px rgba(0,0,0,0.2); padding: 16px; z-index: 2000; border-radius: 8px;"></div>


  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA8K3idA6lR9sfA_fY23H5f4jHeugzSLm4",
      authDomain: "quranquest-370c4.firebaseapp.com",
      projectId: "quranquest-370c4",
      storageBucket: "quranquest-370c4.appspot.com",
      messagingSenderId: "167269428719",
      appId: "1:167269428719:web:4dc5e9dfb91b5805af5a1a",
      measurementId: "G-D7KR30RKFP"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    auth.onAuthStateChanged(user => {
      const streak = getStreak();
      document.getElementById('streakDisplay').textContent = `🔥${streak}`;
      if (user) {
        document.getElementById('userName').textContent = user.displayName;
        document.getElementById('userEmail').textContent = user.email;
      } else {
        document.getElementById('userName').textContent = 'Guest';
        document.getElementById('userEmail').textContent = '';
      }
    });

    function getStreak() {
      const last = localStorage.getItem('lastLoginDay');
      const today = new Date().toISOString().split('T')[0];
      let streak = parseInt(localStorage.getItem('streak') || '0');
      if (last !== today) {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yStr = yesterday.toISOString().split('T')[0];
        streak = (last === yStr) ? streak + 1 : 1;
        localStorage.setItem('streak', streak);
        localStorage.setItem('lastLoginDay', today);
		let loginDays = JSON.parse(localStorage.getItem('loginDays') || '[]');
		if (!loginDays.includes(today)) {
		  loginDays.push(today);
		  localStorage.setItem('loginDays', JSON.stringify(loginDays));
		}
      }
      return streak;
    }

    function toggleMenu() {
      document.getElementById('profileMenu').classList.toggle('open');
    }

    function closeMenuIfOpen(e) {
      const menu = document.getElementById('profileMenu');
      if (menu.classList.contains('open') && !menu.contains(e.target) && !e.target.closest('.menu-toggle')) {
        menu.classList.remove('open');
      }
    }

    function logout() {
      firebase.auth().signOut().then(() => {
        alert("Logged out");
        location.reload();
      });
    }

    const surahSelect = document.getElementById('surahSelect');
    const ayahSelect = document.getElementById('ayahSelect');
    const ayahViewer = document.getElementById('ayahViewer');
    const nextArrow = document.getElementById('nextArrow');
    const prevArrow = document.getElementById('prevArrow');

    function getURLParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    fetch('https://api.quran.com/api/v4/chapters')
      .then(res => res.json())
      .then(data => {
        data.chapters.forEach(ch => {
          const opt = document.createElement('option');
          opt.value = ch.id;
          opt.textContent = `${ch.id}. ${ch.name_simple} (${ch.name_arabic})`;
          opt.setAttribute('data-ayah-count', ch.verses_count);
          surahSelect.appendChild(opt);
        });

        const urlSurah = getURLParam('surah');
        const urlAyah = getURLParam('ayah');
        const lastRead = JSON.parse(localStorage.getItem('lastRead'));

        if (urlSurah && urlAyah) {
          surahSelect.value = urlSurah;
          updateAyahOptions(() => {
            ayahSelect.value = urlAyah;
            loadAyah();
          });
        } else if (lastRead) {
          if (confirm(`📌 Resume from Surah ${lastRead.surah}, Ayah ${lastRead.ayah}?`)) {
            surahSelect.value = lastRead.surah;
            updateAyahOptions(() => {
              ayahSelect.value = lastRead.ayah;
              loadAyah();
            });
            return;
          }
          updateAyahOptions(loadAyah);
        } else {
          updateAyahOptions(() => {
            ayahSelect.value = 1;
            loadAyah();
          });
        }
      });

    function updateAyahOptions(cb) {
      const count = +surahSelect.selectedOptions[0].dataset.ayahCount;
      ayahSelect.innerHTML = '';
      for (let i = 1; i <= count; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${i}`;
        ayahSelect.appendChild(opt);
      }
      if (cb) cb();
    }

    function saveLastRead(s, a) {
      localStorage.setItem('lastRead', JSON.stringify({ surah: s, ayah: a }));
    }

    function loadAyah() {
      const s = surahSelect.value, a = ayahSelect.value;
      ayahViewer.src = `ayahs/surah_${s}/ayah_${s}_${a}.html`;
      ayahViewer.style.display = 'block';
      nextArrow.style.display = 'block';
      prevArrow.style.display = 'block';
      saveLastRead(s, a);
      updateAjrPoints();
    }

    function loadNextAyah() {
      let curr = +ayahSelect.value;
      const max = +surahSelect.selectedOptions[0].dataset.ayahCount;
      if (curr < max) {
        ayahSelect.value = curr + 1;
        loadAyah();
      } else if (surahSelect.selectedIndex < surahSelect.options.length - 1) {
        surahSelect.selectedIndex++;
        updateAyahOptions(() => {
          ayahSelect.value = 1;
          loadAyah();
        });
      } else {
        alert("✅ You've reached the last ayah.");
      }
    }

    function loadPrevAyah() {
      let curr = +ayahSelect.value;
      if (curr > 1) {
        ayahSelect.value = curr - 1;
        loadAyah();
      } else if (surahSelect.selectedIndex > 0) {
        surahSelect.selectedIndex--;
        updateAyahOptions(() => {
          ayahSelect.value = +surahSelect.selectedOptions[0].dataset.ayahCount;
          loadAyah();
        });
      } else {
        alert("📖 This is the very first ayah.");
      }
    }

    function updateAjrPoints() {
      const current = +ayahSelect.value;
      const total = +surahSelect.selectedOptions[0].dataset.ayahCount;
      const percent = Math.floor((current / total) * 100);
      document.getElementById('ajrPoints').textContent = `${percent}%`;
    }

    surahSelect.addEventListener('change', () => updateAyahOptions(loadAyah));
    ayahSelect.addEventListener('change', loadAyah);
	
	
document.addEventListener('click', function (e) {
  const drawer = document.getElementById('profileMenu');
  const toggleBtn = document.querySelector('.menu-toggle');

  if (
    drawer.classList.contains('open') &&
    !drawer.contains(e.target) &&
    !toggleBtn.contains(e.target)
  ) {
    drawer.classList.remove('open');
  }
});


document.getElementById('streakDisplay').addEventListener('click', showStreakCalendar);

function showStreakCalendar() {
  const loginDays = JSON.parse(localStorage.getItem('loginDays') || '[]');
  const calendarDiv = document.getElementById('calendarPopup');
  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth(); // 0-indexed
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  let html = `<div style="font-weight:bold; text-align:center; margin-bottom:8px;">${today.toLocaleString('default', { month: 'long' })} ${year}</div>`;
  html += `<div style="display: grid; grid-template-columns: repeat(7, 28px); gap: 4px; text-align:center;">`;

  // Add weekday headers
  const days = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  for (let d of days) html += `<div style="font-weight:bold;">${d}</div>`;

  const firstDay = new Date(year, month, 1).getDay();
  for (let i = 0; i < firstDay; i++) html += `<div></div>`;

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${(month+1).toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
    const isActive = loginDays.includes(dateStr);
    html += `<div style="padding:4px; border-radius:50%; background:${isActive ? '#0a4d68' : '#eee'}; color:${isActive ? 'white' : '#333'}">${day}</div>`;
  }

  html += `</div>`;
  calendarDiv.innerHTML = html;
  calendarDiv.style.display = 'block';
}

const calendar = document.getElementById('calendarPopup');
if (
  calendar.style.display === 'block' &&
  !calendar.contains(e.target) &&
  !e.target.closest('#streakDisplay')
) {
  calendar.style.display = 'none';
}



  </script>
</body>
</html>
