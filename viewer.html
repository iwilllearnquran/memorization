<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📖 Quran Viewer</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    html, body {
      height: 100%; margin: 0; padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9f9f9;
    }
    .wrapper { display: flex; flex-direction: column; height: 100%; }
    .navbar {
      background-color: #0a4d68;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      border-bottom: 4px solid #2ca7d8;
    }
    .navbar-left, .navbar-center, .navbar-right {
      display: flex;
      align-items: center;
    }
    .navbar-center {
      flex: 1;
      justify-content: center;
      gap: 10px;
    }
    select {
      padding: 8px; font-size: 14px;
      border-radius: 5px; border: 1px solid #ccc;
    }
    .ajr-points {
      background: white; color: #0a4d68;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 14px;
      margin-right: 10px;
    }
    .streak-info {
      font-size: 14px;
    }
    .viewer { flex: 1; position: relative; overflow: hidden; }
    iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
    .side-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: white; color: #0a4d68; border: 2px solid #0a4d68;
      border-radius: 50%; width: 40px; height: 40px;
      font-size: 20px; text-align: center; line-height: 36px;
      cursor: pointer; display: none;
    }
    .next { right: 10px; } .prev { left: 10px; }
	
	
	.menu-toggle {
  background: none;
  color: white;
  font-size: 22px;
  border: none;
  cursor: pointer;
  margin-left: 10px;
}

.menu-panel {
  position: absolute;
  top: 60px;
  right: 10px;
  background: white;
  color: #0a4d68;
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  display: none;
  z-index: 1000;
  font-size: 14px;
  min-width: 180px;
}

.menu-panel button {
  margin-top: 10px;
  padding: 6px 10px;
  font-size: 14px;
  background-color: #f44336;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

  </style>
</head>
<body>
<div class="streak-info" id="streakDisplay">🔥 Streak: 0 days</div>
<button class="menu-toggle" onclick="toggleMenu()">☰</button>
</div> <!-- close .navbar-right -->

<!-- Profile Menu Panel -->
<div class="menu-panel" id="profileMenu">
  <p><strong>👤 Logged in as:</strong> <span id="userName">Guest</span></p>
  <p id="userEmail"></p>
  <button onclick="logout()">Logout</button>
</div>
</body>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA8K3idA6lR9sfA_fY23H5f4jHeugzSLm4",
      authDomain: "quranquest-370c4.firebaseapp.com",
      projectId: "quranquest-370c4",
      storageBucket: "quranquest-370c4.appspot.com",
      messagingSenderId: "167269428719",
      appId: "1:167269428719:web:4dc5e9dfb91b5805af5a1a",
      measurementId: "G-D7KR30RKFP"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.onAuthStateChanged(user => {
	  const streak = getStreak(); // run for everyone
	  document.getElementById('streakDisplay').textContent = `🔥 Streak: ${streak} day${streak === 1 ? '' : 's'}`;
	});


    function getStreak() {
      const last = localStorage.getItem('lastLoginDay');
      const today = new Date().toISOString().split('T')[0];
      let streak = parseInt(localStorage.getItem('streak') || '0');
      if (last !== today) {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yStr = yesterday.toISOString().split('T')[0];
        if (last === yStr) streak++;
        else streak = 1;
        localStorage.setItem('streak', streak);
        localStorage.setItem('lastLoginDay', today);
      }
      return streak;
    }
    const surahSelect = document.getElementById('surahSelect');
    const ayahSelect = document.getElementById('ayahSelect');
    const ayahViewer = document.getElementById('ayahViewer');
    const nextArrow = document.getElementById('nextArrow');
    const prevArrow = document.getElementById('prevArrow');

    function getURLParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    let surahData = [];

    fetch('https://api.quran.com/api/v4/chapters')
      .then(res => res.json())
      .then(data => {
        surahData = data.chapters;
        data.chapters.forEach(ch => {
          const opt = document.createElement('option');
          opt.value = ch.id;
          opt.textContent = `${ch.id}. ${ch.name_simple} (${ch.name_arabic})`;
          opt.setAttribute('data-ayah-count', ch.verses_count);
          surahSelect.appendChild(opt);
        });

        const urlSurah = getURLParam('surah');
        const urlAyah = getURLParam('ayah');
        const lastRead = JSON.parse(localStorage.getItem('lastRead'));

        if (urlSurah && urlAyah) {
          surahSelect.value = urlSurah;
          updateAyahOptions(() => {
            ayahSelect.value = urlAyah;
            loadAyah();
          });
        } else if (lastRead) {
          if (confirm(`📌 Resume from Surah ${lastRead.surah}, Ayah ${lastRead.ayah}?`)) {
            surahSelect.value = lastRead.surah;
            updateAyahOptions(() => {
              ayahSelect.value = lastRead.ayah;
              loadAyah();
            });
            return;
          } else {
            updateAyahOptions(loadAyah);
          }
        } else {
          updateAyahOptions(() => {
            ayahSelect.value = 1;
            loadAyah();
          });
        }
      });

    function updateAyahOptions(cb) {
      const count = +surahSelect.selectedOptions[0].dataset.ayahCount;
      ayahSelect.innerHTML = '';
      for (let i = 1; i <= count; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `Ayah ${i}`;
        ayahSelect.appendChild(opt);
      }
      if (cb) cb();
    }

    function saveLastRead(s, a) {
      localStorage.setItem('lastRead', JSON.stringify({ surah: s, ayah: a }));
    }

    function loadAyah() {
      const s = surahSelect.value, a = ayahSelect.value;
      ayahViewer.src = `ayahs/surah_${s}/ayah_${s}_${a}.html`;
      ayahViewer.style.display = 'block';
      nextArrow.style.display = 'block';
      prevArrow.style.display = 'block';
      saveLastRead(s, a);
	  updateAjrPoints();
      document.getElementById('ajrPoints').textContent = `${Math.floor((a / +surahSelect.selectedOptions[0].dataset.ayahCount) * 100)}%`;
    }

    function loadNextAyah() {
      let curr = +ayahSelect.value;
      const max = +surahSelect.selectedOptions[0].dataset.ayahCount;
      if (curr < max) {
        ayahSelect.value = curr + 1;
        loadAyah();
      } else if (surahSelect.selectedIndex < surahSelect.options.length - 1) {
        surahSelect.selectedIndex++;
        updateAyahOptions(() => {
          ayahSelect.value = 1;
          loadAyah();
        });
      } else {
        alert("✅ You've reached the last ayah.");
      }
    }

    function loadPrevAyah() {
      let curr = +ayahSelect.value;
      if (curr > 1) {
        ayahSelect.value = curr - 1;
        loadAyah();
      } else if (surahSelect.selectedIndex > 0) {
        surahSelect.selectedIndex--;
        updateAyahOptions(() => {
          const newCount = +surahSelect.selectedOptions[0].dataset.ayahCount;
          ayahSelect.value = newCount;
          loadAyah();
        });
      } else {
        alert("📖 This is the very first ayah.");
      }
    }
	
	function updateAjrPoints() {
	  const current = +ayahSelect.value;
	  const total = +surahSelect.selectedOptions[0].dataset.ayahCount;
	  const percent = Math.floor((current / total) * 100);
	  document.getElementById('ajrPoints').textContent = `${percent}%`;
	}
	
	
	function toggleMenu() {
  const menu = document.getElementById('profileMenu');
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}

function logout() {
  firebase.auth().signOut().then(() => {
    alert("Logged out");
    location.reload();
  });
}

auth.onAuthStateChanged(user => {
  const streak = getStreak();
  document.getElementById('streakDisplay').textContent = `🔥 Streak: ${streak} day${streak === 1 ? '' : 's'}`;
  if (user) {
    document.getElementById('userName').textContent = user.displayName;
    document.getElementById('userEmail').textContent = user.email;
  } else {
    document.getElementById('userName').textContent = 'Guest';
    document.getElementById('userEmail').textContent = '';
  }
});



    surahSelect.addEventListener('change', () => updateAyahOptions(loadAyah));
    ayahSelect.addEventListener('change', loadAyah);
  </script>
</body>
</html>
