name: Reel Generate

on:
  workflow_dispatch:
    inputs:
      surah:
        description: "Surah number"
        required: true
        type: number
      ayah:
        description: "Ayah number"
        required: true
        type: number
      source:
        description: "Data source: ayah or dua"
        required: false
        default: "ayah"
        type: choice
        options:
          - ayah
          - dua
      title:
        description: "Video title text"
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick libmagickwand-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-reel-service.txt

      - name: Generate reel
        env:
          REEL_ADMIN_TOKEN: "workflow"
          REEL_USE_REMOTE_INDOPAK: "1"
        run: |
          python scripts/generate_reel_once.py \
            --surah "${{ github.event.inputs.surah }}" \
            --ayah "${{ github.event.inputs.ayah }}" \
            --source "${{ github.event.inputs.source || 'ayah' }}" \
            --title "${{ github.event.inputs.title }}" \
            --out-json generated/reels/result.json

      - name: Upload reel artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.event.inputs.source || 'ayah' }}-s${{ github.event.inputs.surah }}-a${{ github.event.inputs.ayah }}-${{ github.run_id }}
          path: |
            generated/reels/*.mp4
            generated/reels/result.json
          if-no-files-found: error
          retention-days: 14
