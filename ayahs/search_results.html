<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🔍 Quran Word Search</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f9f9f9; }
    nav {
      background: #0a4d68;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav h1 { font-size: 20px; margin: 0; }
    nav button { background: white; color: #0a4d68; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .container { padding: 20px; }
    .meta-info { margin-bottom: 20px; }
    .result {
      background: white;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .ayah-text { font-size: 20px; margin: 12px 0; direction: rtl; background: #f0f8ff; padding: 10px; border-radius: 6px; }
    .highlight { background: yellow; }
    .pagination { text-align: center; margin-top: 30px; }
    .page-btn { margin: 3px; padding: 8px 12px; border: none; border-radius: 6px; background: #eee; cursor: pointer; }
    .page-btn.active { background: #0a4d68; color: white; }
    .verse-link { color: #0a4d68; font-weight: bold; text-decoration: underline; }
  </style>
</head>
<body>

<nav>
  <h1>🔍 Quran Word Search</h1>
</nav>

<div class="container">
  <div class="meta-info">
    <b>Search Word:</b> <span id="query-word">—</span><br>
    <b>Total Matches:</b> <span id="total-matches">—</span><br>
    <b>Pages:</b> <span id="total-pages">—</span>
  </div>

  <div id="results"></div>
  <div class="pagination" id="pagination"></div>
</div>

<script>
const query = new URLSearchParams(window.location.search).get("q") || "";
document.getElementById("query-word").textContent = query || "—";

const apiBase = "https://api.quran.com/api/v4/search";
const waqfMarks = new Set(['\u06D6','\u06D7','\u06D8','\u06D9','\u06DA','\u06DB','\u06DC','\u06DE']);
let currentPage = 1;
let totalPages = 1;

const DIACRITICS_RE = /[\u064B-\u065F\u06D6-\u06ED\u0670\u0640]/;
const DIACRITICS_RE_GLOBAL = /[\u064B-\u065F\u06D6-\u06ED\u0670\u0640]/g;

function normalize(text) {
  return String(text || "").replace(DIACRITICS_RE_GLOBAL, "");
}

function stripWithMap(text) {
  const src = String(text || "");
  const chars = [];
  const map = [];
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    if (DIACRITICS_RE.test(ch)) {
      continue;
    }
    chars.push(ch);
    map.push(i);
  }
  return { norm: chars.join(""), map };
}

function buildHighlightFragment(text, queryText) {
  const rawText = String(text || "");
  const rawQuery = String(queryText || "");
  const frag = document.createDocumentFragment();

  if (!rawText) {
    return frag;
  }

  if (!rawQuery) {
    frag.appendChild(document.createTextNode(rawText));
    return frag;
  }

  const { norm, map } = stripWithMap(rawText);
  const normQuery = normalize(rawQuery);
  if (!normQuery) {
    frag.appendChild(document.createTextNode(rawText));
    return frag;
  }

  const haystack = norm.toLowerCase();
  const needle = normQuery.toLowerCase();
  const ranges = [];
  let idx = 0;
  while ((idx = haystack.indexOf(needle, idx)) !== -1) {
    const start = map[idx];
    let end = map[idx + needle.length - 1];
    if (start !== undefined && end !== undefined) {
      // Extend end to include any subsequent diacritics
      while (end + 1 < rawText.length && DIACRITICS_RE.test(rawText[end + 1])) {
        end++;
      }
      ranges.push({ start, end });
    }
    idx += needle.length;
  }

  if (!ranges.length) {
    frag.appendChild(document.createTextNode(rawText));
    return frag;
  }

  let last = 0;
  for (const range of ranges) {
    if (range.start > last) {
      frag.appendChild(document.createTextNode(rawText.slice(last, range.start)));
    }
    const span = document.createElement("span");
    span.className = "highlight";
    span.textContent = rawText.slice(range.start, range.end + 1);
    frag.appendChild(span);
    last = range.end + 1;
  }

  if (last < rawText.length) {
    frag.appendChild(document.createTextNode(rawText.slice(last)));
  }

  return frag;
}

async function fetchPage(page = 1) {
  const res = await fetch(`${apiBase}?q=${encodeURIComponent(query)}&page=${page}`);
  const data = await res.json();
  const results = data.search.results || [];
  totalPages = data.search.total_pages || 1;
  const totalMatches = data.search.count || 0;

  document.getElementById("total-matches").textContent = totalMatches;
  document.getElementById("total-pages").textContent = totalPages;

  const container = document.getElementById("results");
  container.textContent = "";

  for (const item of results) {
    const verseKey = item.verse_key;
    if (!verseKey) continue;
    const [surahRaw, ayahRaw] = verseKey.split(":");
    const surah = Number.parseInt(surahRaw, 10);
    const ayah = Number.parseInt(ayahRaw, 10);
    if (!Number.isFinite(surah) || !Number.isFinite(ayah)) continue;
    const fullText = item.text;
    const result = document.createElement("div");
    result.className = "result";

    const ayahText = document.createElement("div");
    ayahText.className = "ayah-text";
    ayahText.appendChild(buildHighlightFragment(fullText, query));
    result.appendChild(ayahText);

    const verseRow = document.createElement("div");
    const verseLabel = document.createElement("b");
    verseLabel.textContent = "Verse:";
    const verseLink = document.createElement("a");
    verseLink.className = "verse-link";
    verseLink.href = `surah_${surah}/ayah_${surah}_${ayah}.html`;
    verseLink.target = "_blank";
    verseLink.rel = "noopener noreferrer";
    verseLink.textContent = verseKey;
    verseRow.appendChild(verseLabel);
    verseRow.appendChild(document.createTextNode(" "));
    verseRow.appendChild(verseLink);
    result.appendChild(verseRow);

    container.appendChild(result);
  }

  renderPagination();
}

function renderPagination() {
  const container = document.getElementById("pagination");
  container.textContent = "";

  for (let i = 1; i <= totalPages; i++) {
    const btn = document.createElement("button");
    btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
    btn.textContent = i;
    btn.onclick = () => {
      currentPage = i;
      fetchPage(i);
    };
    container.appendChild(btn);
  }
}

fetchPage(currentPage);
</script>

</body>
</html>
