<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="content"></div>

  <script>
    window.addEventListener('message', async e => {
      if (e.data?.type !== 'LOAD_AYAH') return;

      const { surah, ayah } = e.data;
      console.log('[IFRAME] load', surah, ayah);

      const res = await fetch(
        `/ayahs/surah_${surah}/ayah_${surah}_${ayah}.html`
      );

      const html = await res.text();
      document.getElementById('content').innerHTML = html;
    });
  </script>
</body>
</html>
